<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="navbar">
        <div class="nav-logo border">
            <div class="logo">
            </div>
        </div>
        <!-- addr icon* -->
        <div>
            <div class="nav-address border">
                <p class="Deliver">Deliver to</p>
                 <div class="add-icon">
                    <i class="fa-solid fa-location-dot" style="color: #FFD43B;"></i>
                    <p class="deliver2">India</p>
                 </div>
            </div>
        </div>
          <!-- search icon -->
        <div class="navsearch  border">
            <select class="search-select" >
                <option>All</option>
            </select>
            <input placeholder="Search Amazon" class="search-input">
             <div class="search-icon">
               <i class="fa-solid fa-magnifying-glass"></i>
             </div>
        </div>
        <!-- country info -->
           <div class="country border">
                <select class="flag">
                    <option>EN</option>
                </select>
           </div>

        <!-- sign in info -->
        <div class="nav-signin border">
            <p ><span>Hello, sign in</span></p>
            <P class="nav2nd">Account and lists</P>
        </div>
        <div class="nav-return border">
            <p ><span>Returns</span></p>
            <P class="nav2nd">& Orders</P>
        </div>
        <div class="navcart border">
            <i class="fa-solid fa-cart-shopping"></i>
            Cart
        </div>


    </div>
</header>
</body>
</html>
